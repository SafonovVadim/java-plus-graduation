server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: main-service
          uri: lb://main-service
          predicates:
            - Path=/events/**
            - Path=/categories/**
            - Path=/compilations/**
            - Path=/users/**
            - Path=/admin/**

eureka:
  client:
    service-url:
      default-zone: http://discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
