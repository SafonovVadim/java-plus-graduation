server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info

spring:
  cloud:
    gateway:
      routes:
        - id: events-management
          uri: lb://events-management
          predicates:
            - Path=/users/{userId}/events/**
        - id: requests-management
          uri: lb://events-management
          predicates:
            - Path=/users/{userId}/requests/**
          filters:
            - StripPrefix=0
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
          filters:
            - StripPrefix=0
        - id: administration
          uri: lb://administration
          predicates:
            - Path=/admin/**
        - id: additional-functionality
          uri: lb://additional-functionality
          predicates:
            - Path=/compilations/**,/categories/**,/events/**
          filters:
            - StripPrefix=0



