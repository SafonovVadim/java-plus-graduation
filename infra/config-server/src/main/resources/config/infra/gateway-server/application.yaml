server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info

spring:
  cloud:
    gateway:
      routes:
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**
          filters:
            - StripPrefix=0
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
          filters:
            - StripPrefix=0
        - id: administration
          uri: lb://administration
          predicates:
            - Path=/admin/categories/**, /admin/compilations/**, /admin/events/**
        - id: categories-service
          uri: lb://categories-service
          predicates:
            - Path=/categories/**
          filters:
            - StripPrefix=0
        - id: compilation-service
          uri: lb://compilation-service
          predicates:
            - Path=/compilations/**
          filters:
            - StripPrefix=0
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/events/**, users/{userId}/events/**
          filters:
            - StripPrefix=0



