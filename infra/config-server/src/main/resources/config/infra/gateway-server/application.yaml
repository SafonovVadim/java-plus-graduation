server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info

spring:
  cloud:
    gateway:
      routes:
        - id: main-service
          uri: lb://main-service
          predicates:
            - Path=/events/**
            - Path=/categories/**
            - Path=/compilations/**
            - Path=/users/**
            - Path=/admin/**
          filters:
            - StripPrefix=0


