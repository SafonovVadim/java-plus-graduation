server:
  port: 8080

spring:
  cloud:
    gateway:
      management:
        endpoints:
          web:
            exposure:
              include: gateway,health,info
      routes:
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests/**, /public/requests/**, /users/*/events/*/requests
          filters:
            - StripPrefix=0
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**, /public/users/**
          filters:
            - StripPrefix=0
        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/categories/**, /admin/categories/**
          filters:
            - StripPrefix=0
        - id: compilation-service
          uri: lb://compilation-service
          predicates:
            - Path=/compilations/**, /admin/compilations/**
          filters:
            - StripPrefix=0
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/events/**, /users/*/events/**, /admin/events/**
          filters:
            - StripPrefix=0



