server:
  port: 8080

spring:
  application:
    name: gateway-server
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server
      fail-fast: false
      retry:
        useRandomPolicy: true
        max-interval: 6000
  cloud.gateway:
    routes:
      - id: main-service
        uri: lb://main-service
        predicates:
          - Path=/events/**
          - Path=/categories/**
          - Path=/compilations/**
          - Path=/users/**
          - Path=/admin/**
        filters:
          - StripPrefix=0
management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
      register-with-eureka: true
      fetch-registry: true
      instance:
        prefer-ip-address: true