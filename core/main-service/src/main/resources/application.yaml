spring:
  application:
    name: main-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server
      fail-fast: false
      retry:
        useRandomPolicy: true
        max-interval: 6000

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
      register-with-eureka: true
      fetch-registry: true
      instance:
        prefer-ip-address: true